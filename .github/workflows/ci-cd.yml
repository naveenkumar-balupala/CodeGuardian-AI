name: CodeGuardian AI Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Backend Pytest & Code Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codeguardian
          POSTGRES_PASSWORD: codeguardian_pass
          POSTGRES_DB: codeguardian_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Code Quality Linting
        run: |
          ruff check backend/app

      - name: Run Backend Syntax Verification
        run: |
          python -m compileall backend/app

      - name: Run Backend Pytest Suite with Coverage
        run: |
          cd backend
          python -m pytest -v
        env:
          PYTHONPATH: .
          ENVIRONMENT: testing
          USE_SQLITE_DEV: "true"
          SECRET_KEY: "test_secret_key_super_secure_32chars_min"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Check Frontend TypeScript Compilation
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Frontend ESLint
        run: |
          cd frontend
          npm run lint

      - name: Build Next.js Production Bundle
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e-browser-test:
    name: Playwright E2E Browser Testing
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies & Playwright Browsers
        run: |
          cd frontend
          npm ci || npm install
          npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        run: |
          cd frontend
          npx playwright test

  docker-build-and-scan:
    name: Docker Image Build & Security Scan
    needs: e2e-browser-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t codeguardian-backend:${{ github.sha }} ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t codeguardian-frontend:${{ github.sha }} ./frontend

      - name: Run Trivy Vulnerability Scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'codeguardian-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  deploy:
    name: Production Server Rollout
    needs: docker-build-and-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Execute Remote SSH Production Rollout
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/codeguardian-ai
            git pull origin main
            docker compose -f docker-compose.yml up --build -d
            docker system prune -f
